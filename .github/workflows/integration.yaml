name: Integration

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Merge queue: the same checks run against the queue's merge result, so two
  # PRs that are green alone but red together (a schema change plus a new use
  # of it, a Renovate bump plus a release PR) never reach main. There is no PR
  # to diff against or comment on, so manifests-diff renders every project.
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Go's GC takes a large share of a cue run's CPU at the default 100; 200
  # trades a little memory for ~14% less wall time (measured in etherno-infra).
  GOGC: "200"

jobs:
  # Formatting and lint hooks (treefmt, pre-commit) without the devshell.
  nix-flake-check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      - name: Build checks
        run: nix build .#checks.x86_64-linux.pre-commit .#checks.x86_64-linux.treefmt

  cue-vet:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      - name: Run CUE validation
        run: nix develop .#ci -c bash .github/cue-vet.bash

  # The committed release layer must be exactly what CUE renders from
  # releases.json, otherwise Flux would sync something nobody reviewed.
  release-sync:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      - name: Render release layer
        run: nix develop .#ci -c cue cmd write-release
      - name: Check it is up to date
        run: |
          if ! git diff --exit-code -- clusters; then
            echo "::error::clusters/*/release is stale, run 'cue cmd write-release' and commit"
            exit 1
          fi
          if [[ -n "$(git status --porcelain -- clusters)" ]]; then
            git status --porcelain -- clusters
            echo "::error::untracked release files, run 'cue cmd write-release' and commit"
            exit 1
          fi

  # Talos machine config patches render and validate with throwaway secrets.
  talos:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      - name: Generate and validate
        run: |
          for gen in clusters/*/talos/gen.sh; do
            cluster=$(basename "$(dirname "$(dirname "$gen")")")
            echo "### $cluster"
            OUT_DIR="${RUNNER_TEMP}/talos/${cluster}" nix develop .#ci -c bash "$gen"
          done

  # Projects to diff: the union of the source and target branches (so added
  # and removed projects show up), narrowed to the clusters whose inputs
  # changed. On merge_group every source project is rendered.
  prepare:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      projects: ${{ steps.scope.outputs.projects || steps.merge.outputs.projects }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          path: target
          ref: ${{ github.base_ref }}
          persist-credentials: false
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35

      - name: List projects
        id: merge
        run: |
          SOURCE=$(cd source && nix develop .#ci -c cue cmd list-projects)
          TARGET="[]"
          if [[ -d target ]]; then
            # The base branch uses its own devshell (its CUE) when it has one.
            SHELL_TARGET="${GITHUB_WORKSPACE}/source#ci"
            if nix eval "${GITHUB_WORKSPACE}/target#devShells.x86_64-linux.ci" --apply '_: true' >/dev/null 2>&1; then
              SHELL_TARGET="${GITHUB_WORKSPACE}/target#ci"
            fi
            TARGET=$(cd target && nix develop "$SHELL_TARGET" -c cue cmd list-projects 2>/dev/null) || TARGET="[]"
          fi
          MERGED=$(echo "$SOURCE $TARGET" | jq -sc 'add | unique_by(.cluster + "/" + .project)')
          echo "projects=$MERGED" >> "$GITHUB_OUTPUT"
          echo "Projects: $MERGED"

      # Rendering every project on every PR wastes jobs as clusters grow.
      # Shared inputs keep the full matrix; a change under clusters/<name>/
      # renders that cluster's projects; anything else (docs, Talos patches,
      # the release layer, which release-sync covers) renders nothing.
      - name: Narrow matrix to affected clusters
        id: scope
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          FILES=$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}/files" --paginate -q '.[].filename')
          echo "Changed files:"; echo "${FILES}" | sed 's/^/  /'

          if echo "${FILES}" | grep -qE '^(apps/|crd/|cue\.mod/|nix/|scripts/|\.github/|ext_tool\.cue|flake\.(nix|lock)|clusters/[^/]+\.cue)'; then
            echo "Shared input changed: full matrix"
            echo "projects=${MERGED}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CLUSTERS=$(echo "${FILES}" | jq -R -s -c '
            [splits("\n")] | map(select(length > 0) | split("/"))
            | map(select(.[0] == "clusters" and length > 2))
            | map(select(.[2] != "talos" and .[2] != "release" and .[2] != "releases.json"))
            | map(.[1]) | unique')
          AFFECTED=$(jq -c -n --argjson all "${MERGED}" --argjson c "${CLUSTERS}" \
            '$all | map(select(.cluster as $x | $c | index($x)))')
          echo "projects=${AFFECTED}" >> "$GITHUB_OUTPUT"
          echo "Matrix: ${AFFECTED}"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGED: ${{ steps.merge.outputs.projects }}

  manifests-diff:
    needs: [cue-vet, prepare]
    # An empty matrix is a workflow error, not a skip; final-check accepts the
    # skip only when prepare found nothing to render. On merge_group the job
    # renders only (no base, no diff, no comment): a failed render is the signal.
    if: needs.prepare.outputs.projects != '[]'
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.projects) }}
      fail-fast: false
    steps:
      - name: Generate a token
        id: generate-token
        if: github.event_name == 'pull_request'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }} # zizmor: ignore[secrets-outside-env]
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          path: target
          ref: ${{ github.base_ref }}
          persist-credentials: false
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35

      # Each branch is rendered with its own tools (devshell CUE and
      # scripts/render.sh), so a CUE upgrade in the PR never has to evaluate
      # the base; a branch without them falls back to the source's. A project
      # missing on one side (added/removed) renders as empty.
      - name: Render branches
        run: |
          render() {
            local repo="${GITHUB_WORKSPACE}/$1" out=$2 shell script
            shell="${GITHUB_WORKSPACE}/source#ci"
            if nix eval "${repo}#devShells.x86_64-linux.ci" --apply '_: true' >/dev/null 2>&1; then
              shell="${repo}#ci"
            fi
            script="${repo}/scripts/render.sh"
            [[ -f "$script" ]] || script="${GITHUB_WORKSPACE}/source/scripts/render.sh"
            : > "$out.yaml"
            if (cd "$repo" && nix develop "$shell" -c cue cmd list-projects 2>/dev/null) |
               jq -e --arg c "$MATRIX_CLUSTER" --arg p "$MATRIX_PROJECT" 'any(.[]; .cluster == $c and .project == $p)' >/dev/null; then
              echo "$1: $(cd "$repo" && nix develop "$shell" -c cue version | head -1)"
              (cd "$repo" && nix develop "$shell" -c bash "$script" "$MATRIX_CLUSTER" "$MATRIX_PROJECT" "$out.raw")
              for f in "$out.raw"/*.yaml; do cat "$f"; echo "---"; done > "$out.yaml"
              echo "Rendered $MATRIX_CLUSTER/$MATRIX_PROJECT in $1: $(grep -c '^kind:' "$out.yaml") objects"
            else
              echo "${MATRIX_CLUSTER}/${MATRIX_PROJECT} not present in $1"
            fi
          }
          render source "${RUNNER_TEMP}/source"
          if [[ -d target ]]; then
            render target "${RUNNER_TEMP}/target"
          fi
        env:
          MATRIX_CLUSTER: ${{ matrix.cluster }}
          MATRIX_PROJECT: ${{ matrix.project }}

      # Only the objects that differ, one normalized file each
      # (<namespace>/<kind>/<name>.yaml), see .github/split-manifests.py.
      - name: Lay out changed objects
        if: github.event_name == 'pull_request'
        run: |
          nix develop "${GITHUB_WORKSPACE}/source#ci" -c python3 "${GITHUB_WORKSPACE}/source/.github/split-manifests.py" \
            "${RUNNER_TEMP}/target.yaml" "${RUNNER_TEMP}/source.yaml" \
            "${RUNNER_TEMP}/target" "${RUNNER_TEMP}/source"

      - name: Generate diff
        id: diff
        if: github.event_name == 'pull_request'
        uses: int128/diff-action@5808e847fcbe8a6c943e20d5b372204e99eb2de5 # v2.42.0
        with:
          head: ${{ runner.temp }}/source
          base: ${{ runner.temp }}/target

      - uses: int128/comment-action@304df51b76a99f2ba948f8d780d789b5ecc22893 # v1.80.0
        if: github.event_name == 'pull_request' && steps.diff.outputs.comment-body != ''
        with:
          token: ${{ steps.generate-token.outputs.token }}
          update-if-exists: replace
          update-if-exists-key: ${{ matrix.cluster }}-${{ matrix.project }}
          post: |
            ## Manifests diff: `${{ matrix.cluster }}/${{ matrix.project }}`
            ${{ steps.diff.outputs.comment-body }}

  # The single required status check (branch ruleset).
  final-check:
    needs:
      [nix-flake-check, cue-vet, release-sync, talos, prepare, manifests-diff]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Check results
        run: |
          for r in "nix-flake-check=$NIX" "cue-vet=$VET" "release-sync=$SYNC" "talos=$TALOS" "prepare=$PREPARE"; do
            if [[ "${r#*=}" != "success" ]]; then
              echo "${r%%=*}: ${r#*=}"
              exit 1
            fi
          done
          if [[ "$DIFF" == "skipped" && "$PROJECTS" == "[]" ]]; then
            echo "manifests-diff skipped: nothing to render"
          elif [[ "$DIFF" != "success" ]]; then
            echo "manifests-diff: $DIFF"
            exit 1
          fi
          echo "All checks passed"
        env:
          NIX: ${{ needs.nix-flake-check.result }}
          VET: ${{ needs.cue-vet.result }}
          SYNC: ${{ needs.release-sync.result }}
          TALOS: ${{ needs.talos.result }}
          PREPARE: ${{ needs.prepare.result }}
          DIFF: ${{ needs.manifests-diff.result }}
          PROJECTS: ${{ needs.prepare.outputs.projects }}
