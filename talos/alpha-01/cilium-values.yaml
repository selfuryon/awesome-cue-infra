# Cilium 1.20 for alpha-01: dual-stack, native routing, netkit, no kube-proxy,
# eBPF host routing and masquerading, LoadBalancer IPs from node addresses.
ipv4:
  enabled: true
ipv6:
  enabled: true

ipam:
  mode: kubernetes
k8s:
  requireIPv4PodCIDR: true
  requireIPv6PodCIDR: true

routingMode: native
ipv4NativeRoutingCIDR: 10.244.0.0/16
ipv6NativeRoutingCIDR: fd00:10:244::/56
# Pod CIDRs are private/ULA; egress is masqueraded to the node's addresses
# (for IPv6 Cilium prefers the public one over the ULA node IP).
enableIPv4Masquerade: true
enableIPv6Masquerade: true

kubeProxyReplacement: true
# KubePrism
k8sServiceHost: localhost
k8sServicePort: 7445

devices:
  - enp2s0

bpf:
  datapathMode: netkit
  masquerade: true
  hostLegacyRouting: false

nodeIPAM:
  enabled: true
defaultLBServiceIPAM: nodeipam

loadBalancer:
  acceleration: disabled

operator:
  replicas: 1

# Talos specifics: cgroup v2 already mounted, no SYS_MODULE.
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

hubble:
  enabled: false
prometheus:
  enabled: false
